# Stelliferum Loot Policy - the real config the generator reads.
# Edit here or via the in-app "Loot Policy" tab.
#
# TIER_NAMES: comma-separated. The NUMBER of names = the number of tiers.
TIER_NAMES=Scavenger,Survivor,Constable,Outdoorsman,Insurgent,Infantry,Spec-Ops,Operator,Mythic,Elite,Black Market,Contraband

# Tiers that do NOT world-spawn (nominal 0). T11 = Black Market only, T12 = Contraband.
NOSPAWN_TIERS=11,12

# Tiers excluded from ALL traders (banned/contraband).
NOTRADE_TIERS=12

# Tiers sold at the Black Market in Bitcoin.
BLACKMARKET_TIERS=11

# Tier that blacklisted items are forced into.
CONTRABAND_TIER=12

# Bitcoin world-spawn scaling (rare at MIN tier -> fairly common at MAX tier; 0 = off).
BITCOIN_SPAWN_MIN=3
BITCOIN_SPAWN_MAX=11

# Never-spawn blacklist (comma-separated classnames). Add contraband here.
BLACKLIST=
