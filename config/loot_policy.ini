# Stelliferum Loot Policy — source of truth for tiers (CLI: sfa pipeline / GUI)
# Edit freely; no rebuild required. Reload by re-running pipeline.
#
# TIER_NAMES: comma-separated. Count of names = number of tiers (1-based).
# Progressive fantasy names: coast -> town -> military -> endgame -> black market.
TIER_NAMES=Coast Scav,Town Survivor,Constable,Outdoorsman,Insurgent,Infantry,Spec Ops,Operator,Elite,Mythic,Black Market,Contraband

# No CE world-spawn (nominal forced toward 0). Black Market is trader-only; Contraband banned.
NOSPAWN_TIERS=11,12

# Excluded from all traders
NOTRADE_TIERS=12

# Sold at Black Market in Bitcoin
BLACKMARKET_TIERS=11

# Blacklisted classnames forced into this tier
CONTRABAND_TIER=12

# Bitcoin may world-spawn across mid/high spawning tiers (not BM-only)
BITCOIN_SPAWN_MIN=4
BITCOIN_SPAWN_MAX=10

# ---------------------------------------------------------------------------
# Distribution hints (optional). Applied after tier assignment when present.
# Comma lists align with TIER_NAMES order (tier 1..N).
# Soft targets — pipeline clamps and blends so economies stay playable.
# ---------------------------------------------------------------------------
# Typical map density: high on coast/town, sparse at endgame.
NOMINAL_TARGETS=45,28,18,14,12,8,5,3,2,1,0,0
# Soft floors before restock pressure (usually ~50-70% of nominal)
MIN_TARGETS=28,16,10,8,6,4,2,1,1,0,0,0
# Untouched despawn lifetime in seconds
LIFETIME_TARGETS=3600,5400,7200,9000,10800,14400,18000,21600,28800,36000,86400,86400
# Restock interval seconds (0 = aggressive restock / continuous)
RESTOCK_TARGETS=0,300,600,600,900,1800,1800,3600,3600,7200,0,0

# Never-spawn / ban list (classnames). Forced to CONTRABAND_TIER.
BLACKLIST=
