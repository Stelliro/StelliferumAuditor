# =============================================================================
# Simple CLI recipes for headless / Alpine / console use
# =============================================================================
# Copy to config/commands.ini (optional). Built-in verbs work without this file.
#
# Built-in console verbs (no config required):
#   help | list [path] | pull [name] | pipeline | push | restore | run <recipe>
#
# Recipe keys:
#   action = download | upload | list | pipeline | push | restore | steps
#   remote = remote path (download/upload/list)
#   local  = local path  (download/upload)
#   steps  = comma-separated verbs/recipe names (action=steps only)
#
# Variables (from config/server_paths.ini):
#   ${REMOTE_ROOT} ${LOCAL_ROOT} ${REMOTE_TYPES} ${REMOTE_SPAWNABLE}
#   ${REMOTE_EVENTS} ${REMOTE_GLOBALS} ${REMOTE_TRADER} ${REMOTE_SFL}
# =============================================================================

# Pull mission types.xml
[types]
action=download
remote=${REMOTE_ROOT}${REMOTE_TYPES}
local=${LOCAL_ROOT}/${REMOTE_TYPES}

# Pull spawnable types
[spawnables]
action=download
remote=${REMOTE_ROOT}${REMOTE_SPAWNABLE}
local=${LOCAL_ROOT}/${REMOTE_SPAWNABLE}

# Full local economy pass (no network)
[pipeline]
action=pipeline

# Push generated output pack
[push]
action=push

# Pull types, run pipeline, push result
[cycle]
action=steps
steps=types,pipeline,push
