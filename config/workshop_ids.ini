; ============================================================================
; Stelliferum Auditor — Steam Workshop ID Mapping
; ============================================================================
;
; Maps server mod folder names to their Steam Workshop IDs.
; The auditor uses these IDs to fetch mod descriptions from the Workshop,
; extract classnames, and discover attachment compatibility automatically.
;
; FORMAT:
;   @ModFolderName = WorkshopID
;
; HOW TO FIND WORKSHOP IDs:
;   Open the mod's Steam Workshop page.  The URL contains the ID:
;     https://steamcommunity.com/sharedfiles/filedetails/?id=WORKSHOP_ID
;
; WHAT HAPPENS:
;   1. The auditor fetches the mod's Workshop page via Steam API
;   2. It extracts all DayZ classnames from the description text
;   3. It classifies them (weapon, attachment, equipment, etc.)
;   4. It infers attachment relationships (e.g. SNAFU_AK_Stock → SNAFU_AK47)
;   5. Results are cached in config/web_cache/ for 7 days
;   6. The spawnable generator uses this data to find compatible attachments
;      for modded weapons and equipment
;
; TIPS:
;   - Only add mods that include attachment-bearing items (weapons, vests,
;     backpacks with pouches, plate carriers, helmets with NVG mounts)
;   - The more detailed the mod's Workshop description, the better the
;     extraction works (mod authors who list classnames are ideal)
;   - Results are cached locally — subsequent runs won't hit the network
;     unless the cache is older than 7 days
;
; ============================================================================

